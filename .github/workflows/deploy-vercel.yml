# BTD Yonetim - GitHub push sonrasi Vercel Production deploy
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Uses Deployments API (token cannot authenticate Vercel CLI /v2/user)

name: Deploy Vercel

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Production (Vercel API)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          ORG="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          BODY=$(jq -n \
            --arg name "$REPO" \
            --arg project "$VERCEL_PROJECT_ID" \
            --arg org "$ORG" \
            --arg repo "$REPO" \
            --arg ref "$GITHUB_SHA" \
            '{
              name: $name,
              project: $project,
              target: "production",
              gitSource: {
                type: "github",
                org: $org,
                repo: $repo,
                ref: $ref
              }
            }')
          echo "Creating production deployment for $ORG/$REPO@$GITHUB_SHA"
          RESP=$(curl -sS -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          echo "$RESP" | jq '{id, url, inspectorUrl, readyState, status, error}'
          if echo "$RESP" | jq -e '.error' >/dev/null; then
            echo "Deploy API error"
            exit 1
          fi
          ID=$(echo "$RESP" | jq -r '.id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "No deployment id returned"
            exit 1
          fi
          # Poll until READY or ERROR (up to ~3 min)
          for i in $(seq 1 36); do
            STATE_JSON=$(curl -sS \
              "https://api.vercel.com/v13/deployments/${ID}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")
            STATE=$(echo "$STATE_JSON" | jq -r '.readyState // .status // "unknown"')
            URL=$(echo "$STATE_JSON" | jq -r '.url // empty')
            echo "poll=$i readyState=$STATE url=$URL"
            case "$STATE" in
              READY|ready)
                echo "Deployment ready: https://$URL"
                exit 0
                ;;
              ERROR|error|CANCELED|canceled)
                echo "$STATE_JSON" | jq '{readyState, status, errorMessage, errorCode}'
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for deployment"
          exit 1