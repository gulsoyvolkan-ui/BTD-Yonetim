# BTD Yönetim — kod değişikliği ile production yayını ayrıldı.
# Bu dosya Vercel Deployments API çağırmaz.
# main ve master push bu iş akışını başlatmaz.
# workflow_dispatch production deployment oluşturmaz.
# Production hedefi yok. Ayrı yayın ucu bu dosyada yok.
# Canlı yayın ayrı bir owner kararıdır; bu dosya onu başlatmaz.
# İş akışı kapalı kalır. Açmak production yayını değildir.

name: Deploy Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-kapali:
    runs-on: ubuntu-latest
    steps:
      - name: Production deployment yok
        run: |
          set -euo pipefail
          echo "Bu iş akışı Vercel production deployment oluşturmaz."
          echo "main ve master push tetikleyicisi kaldırıldı."
          echo "Elle çalıştırma production API çağırmaz."
          echo "Production hedefi yok. Ayrı yayın ucu yok."
          exit 1
