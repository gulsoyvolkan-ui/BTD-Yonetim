name: Security regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  auth-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: btd_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/btd_rls_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Auth RLS
        run: bash supabase/tests/run.sh
