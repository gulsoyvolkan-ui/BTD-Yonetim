name: Test

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Security fixtures
        run: node api/_lib/security.test.js
      - name: API selfcheck
        run: node api/_lib/selfcheck.js
      - name: SHADOW read contract
        run: node api/_lib/shadow-read.contract.test.js
      - name: SHADOW read live RLS
        run: node api/_lib/shadow-read.rls.test.js
      - name: Release gate fixtures
        run: node .github/release-gate.test.js
      - name: Secret scan fixtures
        run: node .github/secret-scan.test.js
