name: Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Security fixtures
        run: node api/_lib/security.test.js
      - name: API selfcheck
        run: node api/_lib/selfcheck.js
