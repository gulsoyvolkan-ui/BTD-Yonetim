# Bloklar: Vercel token, GitHub PAT, private key, sb_secret_, service_role JWT
# ve değeri olan SUPABASE_SERVICE_ROLE ataması.
# Postgres rol adı service_role anahtar biçimi değildir.

name: Secret Scan

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan fixtures
        run: node .github/secret-scan.test.js

      - name: Block committed secrets
        run: node .github/secret-scan.js
