# Bloklar: gerçek Vercel token, GitHub PAT, private keys, Supabase service_role JWT
# Dokümantasyon / örnek dosyalardaki "service_role" kelimesi yanlış pozitif sayılmaz.
name: Secret Scan

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block committed secrets
        shell: bash
        run: |
          set -euo pipefail
          # Gerçek sızıntı şekilleri (örnek/yorum satırları ve anon JWT değil)
          PATTERN='vcp_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|sb_secret_[A-Za-z0-9]+'
          # service_role / SUPABASE_SERVICE_ROLE / VERCEL_TOKEN yalnızca gerçek değer atanmışsa
          PATTERN2='(service_role|SUPABASE_SERVICE_ROLE|VERCEL_TOKEN)[[:space:]]*[=:][[:space:]]*['\''\"]?(eyJ|vcp_|[A-Za-z0-9_-]{32,})'

          HITS="$(git grep -nIE "$PATTERN|$PATTERN2" -- \
              ':!.github/workflows/**' \
              ':!.cursor/**' \
              ':!docs/**' \
              ':!**/*.md' \
              ':!**/*.mdc' \
              ':!.env.example' \
              ':!**/.env.example' \
            || true)"

          # Bilinen güvenli / dokümantasyon satırlarını ele
          HITS="$(printf '%s\n' "$HITS" | grep -vE \
            'geçici/demo|anon / publishable|\"role\"[[:space:]]*:[[:space:]]*\"anon\"|rol\":\s*\"anon\"|publishable|BTD_SUPABASE|^\s*#|secrets\.VERCEL_TOKEN|\$\{\{\s*secrets\.' \
            || true)"

          # Boş satırları temizle
          HITS="$(printf '%s\n' "$HITS" | sed '/^$/d' || true)"

          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Depoda olası bir gizli/API anahtarı bulundu. Bunu kaldırın ve kimlik bilgilerini değiştirin."
            exit 1
          fi
          echo "Secret scan passed."
