# Bloklar: Vercel token, GitHub PAT, private keys, Supabase service_role
name: Secret Scan

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block committed secrets
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='vcp_[A-Za-z0-9]{20,}|VERCEL_TOKEN[[:space:]]*=[[:space:]]*[^[:space:]]+|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|service_role|SUPABASE_SERVICE_ROLE|sb_secret_[A-Za-z0-9]+'
          # tracked files only; skip this workflow file's pattern string via inverse match on actual token shapes
          if git grep -nIE "$PATTERN" -- \
              ':!.github/workflows/secret-scan.yml' \
              ':!docs/**' \
              ':!**/*.md' \
            | grep -vE 'service_role.*#|geçici/demo|anon / publishable|rol\":\s*\"anon\"|\"role\":\"anon\"'; then
            echo "::error::Possible secret/API key found in repository. Remove it and rotate the credential."
            exit 1
          fi
          echo "Secret scan passed."
