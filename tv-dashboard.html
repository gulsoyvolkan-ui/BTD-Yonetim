<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#020617" />
<meta name="robots" content="noindex" />
<title>BTD Core · Andon Atölye TV (32")</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          void: '#020617',
          neon: { DEFAULT: '#22d3ee', dim: '#0891b2', glow: '#67e8f9' },
          acid: { DEFAULT: '#4ade80', dim: '#16a34a', glow: '#86efac' },
          warn: '#fbbf24',
        },
        fontFamily: {
          display: ['"Orbitron"', 'ui-sans-serif', 'sans-serif'],
          body: ['"Rajdhani"', 'ui-sans-serif', 'sans-serif'],
          mono: ['"Share Tech Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<style>
  /*
    Hedef: 32" TV · Full HD 1920×1080
    Ölçüler viewport birimleriyle (vh/vw) — scroll yok, tam ekran.
  */
  :root {
    --scanline: rgba(34, 211, 238, 0.03);
    --grid-line: rgba(34, 211, 238, 0.055);
    --pad: clamp(8px, 1vh, 14px);
    --gap: clamp(6px, 0.85vh, 12px);
    --fs-label: clamp(11px, 1.35vh, 15px);
    --fs-title: clamp(18px, 2.4vh, 28px);
    --fs-wo: clamp(22px, 3.4vh, 40px);
    --fs-part: clamp(16px, 2.5vh, 30px);
    --fs-meta: clamp(12px, 1.7vh, 18px);
    --fs-pct: clamp(26px, 4vh, 46px);
    --fs-clock: clamp(28px, 5vh, 52px);
    --fs-brand: clamp(12px, 1.6vh, 18px);
    --fs-h1: clamp(20px, 3.2vh, 36px);
    --fs-print: clamp(11px, 1.45vh, 15px);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #020617;
    color: #e2e8f0;
    font-family: 'Rajdhani', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(900px 420px at 8% -8%, rgba(8, 145, 178, 0.16), transparent 55%),
      radial-gradient(700px 380px at 96% 108%, rgba(22, 163, 74, 0.1), transparent 50%),
      linear-gradient(180deg, #020617 0%, #04101f 45%, #020617 100%);
    cursor: none; /* kiosk TV */
  }

  .shell {
    height: 100vh;
    height: 100dvh;
    width: 100vw;
    display: grid;
    grid-template-rows: auto 1fr;
    gap: var(--gap);
    padding: var(--pad) calc(var(--pad) + 4px) var(--pad);
  }

  .board {
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: var(--gap);
  }

  .zone-cnc1 { grid-column: 1 / 3; grid-row: 1; }
  .zone-cnc2 { grid-column: 3 / 5; grid-row: 1; }
  .zone-univ { grid-column: 5 / 7; grid-row: 1; }
  .zone-weld { grid-column: 1 / 4; grid-row: 2; }
  .zone-print { grid-column: 4 / 7; grid-row: 2; }

  .zone {
    position: relative;
    min-height: 0;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid rgba(34, 211, 238, 0.22);
    background:
      linear-gradient(145deg, rgba(10, 22, 40, 0.96), rgba(7, 14, 28, 0.98)),
      repeating-linear-gradient(0deg, transparent, transparent 3px, var(--scanline) 3px, var(--scanline) 4px);
    box-shadow: inset 0 0 28px rgba(34, 211, 238, 0.035), 0 12px 32px rgba(0, 0, 0, 0.35);
    padding: clamp(8px, 1.1vh, 14px) clamp(10px, 1.2vh, 16px);
    display: flex;
    flex-direction: column;
  }

  .zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.3), transparent 65%);
    pointer-events: none;
  }

  .zone-accent-cyan { border-color: rgba(34, 211, 238, 0.35); }
  .zone-accent-green { border-color: rgba(74, 222, 128, 0.35); }
  .zone-accent-amber { border-color: rgba(251, 191, 36, 0.3); }

  .status-live { box-shadow: 0 0 10px rgba(74, 222, 128, 0.75); animation: pulse-glow 1.6s ease-in-out infinite; }
  .status-idle { box-shadow: 0 0 6px rgba(148, 163, 184, 0.35); }
  .status-warn { box-shadow: 0 0 10px rgba(251, 191, 36, 0.7); animation: pulse-glow 1.2s ease-in-out infinite; }

  @keyframes pulse-glow {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(1.12); }
  }

  @keyframes bar-shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  .progress-fill {
    background: linear-gradient(90deg, #0891b2, #22d3ee, #4ade80, #22d3ee, #0891b2);
    background-size: 200% 100%;
    animation: bar-shine 3.5s linear infinite;
    box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-fill.is-done {
    background: linear-gradient(90deg, #16a34a, #4ade80);
    animation: none;
    box-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
  }

  .printer-pulse { animation: pulse-glow 1.4s ease-in-out infinite; }
  .header-brand { text-shadow: 0 0 18px rgba(34, 211, 238, 0.35); }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: var(--fs-clock);
    text-shadow: 0 0 22px rgba(34, 211, 238, 0.45);
  }

  .fade-flash { animation: data-flash 0.5s ease; }
  @keyframes data-flash {
    0% { filter: brightness(1.3); }
    100% { filter: brightness(1); }
  }

  .t-label { font-size: var(--fs-label); letter-spacing: 0.14em; text-transform: uppercase; }
  .t-title { font-size: var(--fs-title); }
  .t-wo { font-size: var(--fs-wo); }
  .t-part { font-size: var(--fs-part); }
  .t-meta { font-size: var(--fs-meta); }
  .t-pct { font-size: var(--fs-pct); }
  .t-brand { font-size: var(--fs-brand); }
  .t-h1 { font-size: var(--fs-h1); }
  .t-print { font-size: var(--fs-print); }
</style>
</head>
<body>
  <div class="shell">
    <header class="relative z-10 flex items-center justify-between gap-3 min-h-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-2.5 self-stretch min-h-[2.5rem] rounded-full bg-neon shadow-[0_0_14px_rgba(34,211,238,0.8)] shrink-0"></div>
        <div class="min-w-0">
          <p class="font-display text-neon tracking-[0.32em] uppercase header-brand t-brand">BTD CORE · ANDON</p>
          <h1 class="font-display font-bold text-white tracking-wide leading-none mt-0.5 t-h1">
            ATÖLYE TV <span class="text-neon-glow">32"</span>
          </h1>
        </div>
        <div class="hidden md:flex items-center gap-2 ml-3 pl-3 border-l border-neon/20">
          <span class="w-2.5 h-2.5 rounded-full bg-acid status-live"></span>
          <span class="font-body font-semibold text-acid tracking-wide uppercase t-meta">Canlı · Salt Okunur</span>
        </div>
      </div>

      <div class="text-right shrink-0">
        <div id="digitalClock" class="font-mono clock text-neon-glow leading-none">--:--:--</div>
        <p class="font-body text-slate-400 mt-0.5 tracking-wide t-meta">
          Son Güncelleme: <span id="lastUpdateLabel" class="text-neon font-semibold">—</span>
        </p>
      </div>
    </header>

    <main id="andonBoard" class="board"></main>
  </div>

<script>
(function () {
  'use strict';

  const REFRESH_MS = 30000;
  const workshopDefs = [
    { id: 'cnc1', title: 'CNC Atölyesi 1', css: 'zone-cnc1 zone-accent-cyan' },
    { id: 'cnc2', title: 'CNC Atölyesi 2', css: 'zone-cnc2 zone-accent-cyan' },
    { id: 'univ', title: 'Üniversal Atölyesi', css: 'zone-univ zone-accent-amber' },
    { id: 'weld', title: 'Kaynak / Montaj', css: 'zone-weld zone-accent-green' },
    { id: 'print', title: '3D Baskı Atölyesi', css: 'zone-print zone-accent-green', isPrint: true },
  ];

  const seedJobs = [
    { wo: 'IE-2608-014', part: 'Gövde Flanşı B-12', machine: 'HERMLE 600 V' },
    { wo: 'IE-2608-019', part: 'Mil Muhafaza KM-4', machine: 'MICROCUT M1050' },
    { wo: 'IE-2608-021', part: 'Kapak Plakası TP-7', machine: 'MICROCUT M1200' },
    { wo: 'IE-2608-008', part: 'Bağlantı Kolu BR-3', machine: 'TOS Torna' },
    { wo: 'IE-2608-025', part: 'Şasi Kaynak Grubu', machine: 'ESAB TIG' },
    { wo: 'IE-2608-031', part: 'Montaj Aparatı M-2', machine: 'Montaj Hattı' },
    { wo: 'IE-2608-033', part: 'Prototip Kasa V2', machine: 'Bambulab H2D' },
    { wo: 'IE-2608-034', part: 'Kılavuz Jig P-1', machine: 'Bambulab H2S' },
    { wo: 'IE-2608-036', part: 'Sensor Braket', machine: 'Bambulab P2S' },
  ];

  const printDeviceNames = ['Bambulab H2D', 'Bambulab H2S', 'Bambulab P2S'];
  let lastFetchAt = Date.now();

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function pick(arr) {
    return arr[rand(0, arr.length - 1)];
  }

  function statusFromPct(pct) {
    if (pct >= 100) return { label: 'TAMAM', cls: 'bg-acid text-void' };
    if (pct >= 70) return { label: 'AKTİF', cls: 'bg-neon/20 text-neon border border-neon/40' };
    if (pct >= 35) return { label: 'İŞLEMDE', cls: 'bg-cyan-500/15 text-neon-glow border border-cyan-400/30' };
    return { label: 'BAŞLIYOR', cls: 'bg-warn/15 text-warn border border-warn/35' };
  }

  /** Simülasyon — sonra gerçek Supabase sorgusu ile değiştirilecek */
  async function fetchAndonFromSupabase() {
    await new Promise((r) => setTimeout(r, 160 + Math.random() * 200));
    const used = new Set();
    const workshops = workshopDefs.map((def) => {
      let job;
      do { job = pick(seedJobs); } while (used.has(job.wo) && used.size < seedJobs.length);
      used.add(job.wo);
      const pct = rand(8, 98);
      const idle = Math.random() < 0.12;
      const base = {
        id: def.id,
        title: def.title,
        css: def.css,
        isPrint: !!def.isPrint,
        idle,
        wo: idle ? '—' : job.wo,
        part: idle ? 'Beklemede' : job.part,
        machine: idle ? '—' : job.machine,
        pct: idle ? 0 : pct,
      };
      if (def.isPrint) {
        base.printers = printDeviceNames.map((name) => ({
          name,
          nozzle: +(190 + Math.random() * 70).toFixed(0),
          bed: +(45 + Math.random() * 55).toFixed(0),
          remainMin: rand(12, 240),
          running: Math.random() > 0.18,
        }));
      }
      return base;
    });
    return { fetchedAt: Date.now(), workshops };
  }

  function formatRemain(min) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    return h <= 0 ? `${m} dk` : `${h}s ${String(m).padStart(2, '0')}dk`;
  }

  function renderZone(ws) {
    const st = ws.idle
      ? { label: 'BOŞ', cls: 'bg-slate-700/50 text-slate-300 border border-slate-500/30' }
      : statusFromPct(ws.pct);
    const dotCls = ws.idle ? 'bg-slate-400 status-idle' : (ws.pct < 35 ? 'bg-warn status-warn' : 'bg-acid status-live');
    const fillCls = ws.pct >= 100 ? 'progress-fill is-done' : 'progress-fill';

    const printersHtml = ws.isPrint ? `
      <div class="mt-auto pt-1.5 grid grid-cols-3 gap-1.5 min-h-0">
        ${(ws.printers || []).map((p) => `
          <div class="rounded-md border ${p.running ? 'border-acid/35 bg-acid/5' : 'border-slate-600/40 bg-slate-900/40'} px-2 py-1.5">
            <div class="flex items-center justify-between gap-1">
              <p class="font-body font-bold text-white truncate leading-tight t-print">${p.name.replace('Bambulab ', '')}</p>
              <span class="w-2 h-2 rounded-full shrink-0 ${p.running ? 'bg-acid printer-pulse' : 'bg-slate-500'}"></span>
            </div>
            <p class="font-mono text-neon leading-none mt-0.5 t-print">
              ${p.running ? `${p.nozzle}° · ${p.bed}°` : 'STANDBY'}
            </p>
            <p class="font-body font-semibold leading-tight ${p.running ? 'text-acid' : 'text-slate-500'} t-meta">
              ${p.running ? formatRemain(p.remainMin) : '—'}
            </p>
          </div>
        `).join('')}
      </div>
    ` : '';

    return `
      <section class="zone ${ws.css}" data-zone="${ws.id}">
        <div class="relative z-[1] flex items-start justify-between gap-2 shrink-0">
          <div class="min-w-0">
            <p class="font-display text-neon/70 t-label">Atölye</p>
            <h2 class="font-display font-bold text-white tracking-wide leading-tight truncate t-title">${ws.title}</h2>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <span class="w-2.5 h-2.5 rounded-full ${dotCls}"></span>
            <span class="font-display tracking-wider px-2 py-0.5 rounded t-label ${st.cls}">${st.label}</span>
          </div>
        </div>

        <div class="relative z-[1] flex-1 min-h-0 grid content-center gap-2 py-1">
          <div>
            <p class="font-body text-slate-400 font-semibold t-label">Aktif İş Emri</p>
            <p class="font-mono text-neon-glow leading-none mt-0.5 t-wo">${ws.wo}</p>
          </div>
          <div>
            <p class="font-body text-slate-400 font-semibold t-label">İşlenen Parça</p>
            <p class="font-display font-semibold text-white leading-tight mt-0.5 truncate t-part">${ws.part}</p>
            <p class="font-body text-slate-400 truncate t-meta">${ws.machine}</p>
          </div>
        </div>

        <div class="relative z-[1] shrink-0">
          <div class="flex items-end justify-between gap-2 mb-1">
            <p class="font-body text-slate-400 font-semibold t-label">Tamamlanma</p>
            <p class="font-mono leading-none ${ws.pct >= 100 ? 'text-acid' : 'text-white'} t-pct">${ws.pct}<span class="text-slate-400 t-meta">%</span></p>
          </div>
          <div class="h-2.5 rounded-full bg-slate-900/80 border border-slate-700/80 overflow-hidden">
            <div class="${fillCls} h-full rounded-full" style="width:${Math.max(ws.idle ? 0 : 4, ws.pct)}%"></div>
          </div>
          ${printersHtml}
        </div>
      </section>
    `;
  }

  function renderBoard(data) {
    const board = document.getElementById('andonBoard');
    board.innerHTML = data.workshops.map(renderZone).join('');
    board.classList.remove('fade-flash');
    void board.offsetWidth;
    board.classList.add('fade-flash');
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('digitalClock').textContent =
      [now.getHours(), now.getMinutes(), now.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':');
    const ago = Math.max(0, Math.floor((Date.now() - lastFetchAt) / 1000));
    document.getElementById('lastUpdateLabel').textContent = ago < 1 ? 'az önce' : `${ago} sn önce`;
  }

  async function refreshDashboard() {
    try {
      const data = await fetchAndonFromSupabase();
      lastFetchAt = data.fetchedAt;
      renderBoard(data);
      updateClock();
    } catch (err) {
      console.warn('[Andon]', err);
      document.getElementById('lastUpdateLabel').textContent = 'bağlantı hatası';
    }
  }

  refreshDashboard();
  setInterval(refreshDashboard, REFRESH_MS);
  setInterval(updateClock, 1000);

  if (navigator.wakeLock) {
    const requestWake = () => navigator.wakeLock.request('screen').catch(() => {});
    requestWake();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWake();
    });
  }

  // F11 ipucu: çift tık = tam ekran (imleç gizli kiosk’ta dokunmatik/uzaktan)
  document.addEventListener('dblclick', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  });
})();
</script>
</body>
</html>
